[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-worldgen-studio"
version = "0.4.5b30"
description = "In-game worldgen, chunk interceptor, and scheduler stress test plugin for Endstone"
readme = "README.md"
requires-python = "==3.14.*"
dependencies = [
    "endstone==0.11.6",
]

[project.entry-points."endstone"]
"worldgen-studio" = "endstone_worldgen_studio:WorldGenStudioPlugin"

[tool.setuptools]
packages = ["endstone_worldgen_studio", "endstone_worldgen"]
package-dir = {endstone_worldgen_studio = "src/endstone_worldgen_studio", endstone_worldgen = "../../../python/endstone_worldgen"}
